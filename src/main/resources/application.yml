spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://YOUR-TENANT.us.auth0.com/
          audience: https://your-api-identifier
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false