spring:
  # In-memory H2 for local development. Fresh DB each run.
  datasource:
    url: jdbc:h2:mem:penpals;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # Run schema.sql then data.sql on startup.
  sql:
    init:
      mode: always

  jpa:
    hibernate:
      # schema.sql is the source of truth — don't let Hibernate create/alter tables too.
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Browse the in-memory DB at http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true